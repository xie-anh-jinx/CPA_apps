version: "3.9"

services:
  # ─── Existing Database (restore dari cpa_13022024.sql, read-only untuk app baru) ───
  db_existing:
    image: postgres:15-alpine
    container_name: cpa_db_existing
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EXISTING_DB_NAME:-cpa_existing}
      POSTGRES_USER: ${EXISTING_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${EXISTING_DB_PASSWORD:-postgres123}
    volumes:
      - db_existing_data:/var/lib/postgresql/data
      - ./scripts/init_existing.sh:/docker-entrypoint-initdb.d/init.sh:ro
    # ports:
    #   - "5433:5432"
    networks:
      - cpa_net
      - dwh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXISTING_DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Analytics Database (ODS + Analytics + CRM schema) ───
  db_analytics:
    image: postgres:15-alpine
    container_name: cpa_db_analytics
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ANALYTICS_DB_NAME:-cpa_analytics}
      POSTGRES_USER: ${ANALYTICS_DB_USER:-cpa_admin}
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:-cpa_secure_2024}
    volumes:
      - db_analytics_data:/var/lib/postgresql/data
    # ports:
    #   - "5435:5432"
    networks:
      - cpa_net
      - dwh_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ANALYTICS_DB_USER:-cpa_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Cache, Queue, Pub/Sub) ───
  redis:
    image: redis:7-alpine
    container_name: cpa_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_cpa_2024} --appendonly yes
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    networks:
      - cpa_net
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_cpa_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpa_backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db_existing:
        condition: service_healthy
      db_analytics:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cpa_net
      - dwh_network
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ─── Celery Worker ───
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpa_celery_worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      db_existing:
        condition: service_healthy
      db_analytics:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cpa_net
    volumes:
      - ./backend/app:/app/app
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q sync,analytics,alerts

  # ─── Celery Beat (Scheduler) ───
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpa_celery_beat
    restart: unless-stopped
    env_file: .env
    volumes:
      - celery_beat_data:/var/celery
    depends_on:
      - celery_worker
    networks:
      - cpa_net
    command: celery -A app.workers.celery_app beat --loglevel=info --pidfile=/var/celery/celerybeat.pid

  # ─── Flower (Celery Monitor) ───
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpa_flower
    restart: unless-stopped
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    networks:
      - cpa_net
      - dwh_network
    command: celery -A app.workers.celery_app flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower2024}

  # ─── Next.js Frontend ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    container_name: cpa_frontend
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - cpa_net
      - dwh_network

  # ─── Nginx Reverse Proxy ───
  # CATATAN: Nginx CPA tidak digunakan karena port 80/443 sudah
  # ditangani oleh nginx data_warehouse. Routing dilakukan via
  # conf.d di /root/data_warehouse/nginx/conf.d/warehouse.conf
  # nginx:
  #   image: nginx:alpine
  #   container_name: cpa_nginx

volumes:
  db_existing_data:
  db_analytics_data:
  redis_data:
  celery_beat_data:

networks:
  cpa_net:
    driver: bridge
  dwh_network:
    external: true
    name: data_warehouse_dwh_network

