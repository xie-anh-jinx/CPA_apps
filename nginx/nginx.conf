worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend  { server backend:8000; }
    upstream frontend { server frontend:3000; }

    # ── HTTP → HTTPS Redirect ──────────────────────────────────────
    server {
        listen 80;
        server_name warehouse.pengajaran.com www.warehouse.pengajaran.com;

        # Certbot ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Main Server ──────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name warehouse.pengajaran.com www.warehouse.pengajaran.com;

        ssl_certificate     /etc/letsencrypt/live/warehouse.pengajaran.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/warehouse.pengajaran.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Strict-Transport-Security "max-age=31536000" always;

        # ── Frontend (Next.js) ──
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Backend API ──
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ── WebSocket ──
        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # ── FastAPI Docs (opsional, bisa dihapus di production) ──
        location /docs {
            proxy_pass http://backend/docs;
        }
        location /redoc {
            proxy_pass http://backend/redoc;
        }

        # ── Flower (Celery Monitor) ──
        location /flower/ {
            proxy_pass http://flower:5555/;
            proxy_set_header Host $host;
        }
    }

    # ── Fallback: HTTP tanpa domain (akses langsung via IP) ────────
    server {
        listen 80 default_server;
        server_name _;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ws/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
